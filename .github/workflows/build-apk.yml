name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate missing Android platform files
        run: flutter create --platforms=android --org com.example --project-name quick_rewards .
        
      - name: Fix Kotlin version
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi

      - name: Set minimum Android SDK version (Firebase needs 23+)
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle.kts
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-rewards-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
